name: quality_check

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  format:
    name: format
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: install nightly rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: nightly
          components: rustfmt

      - name: install taplo
        uses: taiki-e/install-action@67729d5c413db75907f0ad1e39bb04b9c868ff60
        with:
          tool: taplo-cli@0.10.0

      - name: taplo fmt
        run: taplo fmt --check

      - name: cargo fmt
        run: cargo +nightly fmt --all -- --check

  msrv:
    name: msrv
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUSTFLAGS: -Dwarnings
      RUSTDOCFLAGS: -Dwarnings

    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: install MSRV toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.98.0
          components: clippy

      - name: verify MSRV
        run: test "$(rustc +1.98.0 --version --verbose | awk '$1 == "release:" { print $2 }')" = "1.98.0"

      - name: record start
        id: start
        shell: bash
        run: echo "started=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: cargo check
        id: check
        run: cargo +1.98.0 check --workspace --all-targets --all-features --locked

      - name: cargo clippy
        id: clippy
        run: cargo +1.98.0 clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: cargo test
        id: test
        run: cargo +1.98.0 test --workspace --all-features --locked

      - name: quality attestation
        if: always()
        shell: bash
        env:
          CHECK: ${{ steps.check.outcome }}
          CLIPPY: ${{ steps.clippy.outcome }}
          TEST: ${{ steps.test.outcome }}
          JOB_STATUS: ${{ job.status }}
          STARTED: ${{ steps.start.outputs.started }}
        run: |
          set -euo pipefail
          mkdir -p target
          commit=$(git rev-parse HEAD)
          lock=$(sha256sum Cargo.lock | awk '{ print $1 }')
          now=$(date +%s)
          duration=$((now - ${STARTED:-$now}))
          if [ "$duration" -lt 0 ]; then duration=0; fi
          uninterrupted=true
          [ "$JOB_STATUS" = "cancelled" ] && uninterrupted=false
          result=fail
          if [ "$CHECK" = "success" ] && [ "$CLIPPY" = "success" ] \
            && [ "$TEST" = "success" ] && [ "$uninterrupted" = "true" ]; then
            result=pass
          fi
          # The canonical test-attestation record (T-G10-07): every field
          # the sealed ledger validator requires, bound to the tested commit.
          printf '{"schema":"radiata.woooo.tech/schemas/test-attestation","commit":"%s","lock_digest":"%s","provider_run_id":"%s","attempt":"%s","job":"msrv","target":"quality-msrv","budget_seconds":0,"duration_seconds":%s,"uninterrupted":%s,"retry":"complete","predecessor":"","result":"%s"}\n' \
            "$commit" "$lock" "${{ github.run_id }}" "${{ github.run_attempt }}" \
            "$duration" "$uninterrupted" "$result" > target/attestation-quality-msrv.json
          cat target/attestation-quality-msrv.json

      - name: upload attestation
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: quality-attestation-msrv
          path: target/attestation-quality-msrv.json
          retention-days: 30

  stable:
    name: stable
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUSTFLAGS: -Dwarnings
      RUSTDOCFLAGS: -Dwarnings

    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: install stable rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: stable
          components: clippy

      - name: report stable toolchain
        run: rustc +stable --version --verbose

      - name: record start
        id: start
        shell: bash
        run: echo "started=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: cargo check
        id: check
        run: cargo +stable check --workspace --all-targets --all-features --locked

      - name: cargo clippy
        id: clippy
        run: cargo +stable clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: cargo test
        id: test
        run: cargo +stable test --workspace --all-features --locked

      - name: quality attestation
        if: always()
        shell: bash
        env:
          CHECK: ${{ steps.check.outcome }}
          CLIPPY: ${{ steps.clippy.outcome }}
          TEST: ${{ steps.test.outcome }}
          JOB_STATUS: ${{ job.status }}
          STARTED: ${{ steps.start.outputs.started }}
        run: |
          set -euo pipefail
          mkdir -p target
          commit=$(git rev-parse HEAD)
          lock=$(sha256sum Cargo.lock | awk '{ print $1 }')
          now=$(date +%s)
          duration=$((now - ${STARTED:-$now}))
          if [ "$duration" -lt 0 ]; then duration=0; fi
          uninterrupted=true
          [ "$JOB_STATUS" = "cancelled" ] && uninterrupted=false
          result=fail
          if [ "$CHECK" = "success" ] && [ "$CLIPPY" = "success" ] \
            && [ "$TEST" = "success" ] && [ "$uninterrupted" = "true" ]; then
            result=pass
          fi
          printf '{"schema":"radiata.woooo.tech/schemas/test-attestation","commit":"%s","lock_digest":"%s","provider_run_id":"%s","attempt":"%s","job":"stable","target":"quality-stable","budget_seconds":0,"duration_seconds":%s,"uninterrupted":%s,"retry":"complete","predecessor":"","result":"%s"}\n' \
            "$commit" "$lock" "${{ github.run_id }}" "${{ github.run_attempt }}" \
            "$duration" "$uninterrupted" "$result" > target/attestation-quality-stable.json
          cat target/attestation-quality-stable.json

      - name: upload attestation
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: quality-attestation-stable
          path: target/attestation-quality-stable.json
          retention-days: 30

  macos:
    name: macos
    runs-on: macos-latest
    timeout-minutes: 25
    env:
      RUSTFLAGS: -Dwarnings
      RUSTDOCFLAGS: -Dwarnings

    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: install MSRV toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.98.0
          components: clippy

      - name: record start
        id: start
        shell: bash
        run: echo "started=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: cargo check
        id: check
        run: cargo +1.98.0 check --workspace --all-targets --all-features --locked

      - name: cargo clippy
        id: clippy
        run: cargo +1.98.0 clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: cargo test
        id: test
        run: cargo +1.98.0 test --workspace --all-features --locked

      - name: native feature checks
        id: native_checks
        shell: bash
        run: |
          cargo +1.98.0 check --locked --no-default-features
          cargo +1.98.0 check --locked --no-default-features --features redb

      - name: install cargo-hack
        uses: taiki-e/install-action@67729d5c413db75907f0ad1e39bb04b9c868ff60
        with:
          tool: cargo-hack@0.6.45

      - name: native feature powerset check
        id: powerset
        run: cargo +1.98.0 hack check --feature-powerset --depth 1 --locked

      - name: fixed simulator gate
        id: simulator
        run: cargo +1.98.0 test --locked --lib simulation::network::tests::simulation_network_fault_matrix_gate -- --ignored --exact

      - name: quality attestation
        if: always()
        shell: bash
        env:
          CHECK: ${{ steps.check.outcome }}
          CLIPPY: ${{ steps.clippy.outcome }}
          TEST: ${{ steps.test.outcome }}
          NATIVE_CHECKS: ${{ steps.native_checks.outcome }}
          POWERSET: ${{ steps.powerset.outcome }}
          SIMULATOR: ${{ steps.simulator.outcome }}
          JOB_STATUS: ${{ job.status }}
          STARTED: ${{ steps.start.outputs.started }}
        run: |
          set -euo pipefail
          mkdir -p target
          commit=$(git rev-parse HEAD)
          lock=$(sha256sum Cargo.lock | awk '{ print $1 }')
          now=$(date +%s)
          duration=$((now - ${STARTED:-$now}))
          if [ "$duration" -lt 0 ]; then duration=0; fi
          uninterrupted=true
          [ "$JOB_STATUS" = "cancelled" ] && uninterrupted=false
          result=pass
          for outcome in "$CHECK" "$CLIPPY" "$TEST" "$NATIVE_CHECKS" \
            "$POWERSET" "$SIMULATOR"; do
            [ "$outcome" = "success" ] || result=fail
          done
          if [ "$uninterrupted" != "true" ]; then result=fail; fi
          printf '{"schema":"radiata.woooo.tech/schemas/test-attestation","commit":"%s","lock_digest":"%s","provider_run_id":"%s","attempt":"%s","job":"macos","target":"quality-macos","budget_seconds":0,"duration_seconds":%s,"uninterrupted":%s,"retry":"complete","predecessor":"","result":"%s"}\n' \
            "$commit" "$lock" "${{ github.run_id }}" "${{ github.run_attempt }}" \
            "$duration" "$uninterrupted" "$result" > target/attestation-quality-macos.json
          cat target/attestation-quality-macos.json

      - name: upload attestation
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: quality-attestation-macos
          path: target/attestation-quality-macos.json
          retention-days: 30

  windows:
    name: windows
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      RUSTFLAGS: -Dwarnings
      RUSTDOCFLAGS: -Dwarnings

    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: install MSRV toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.98.0
          components: clippy

      - name: record start
        id: start
        shell: bash
        run: echo "started=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: cargo check
        id: check
        run: cargo +1.98.0 check --workspace --all-targets --all-features --locked

      - name: cargo clippy
        id: clippy
        run: cargo +1.98.0 clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: cargo test
        id: test
        run: cargo +1.98.0 test --workspace --all-features --locked

      - name: native feature checks
        id: native_checks
        shell: bash
        run: |
          cargo +1.98.0 check --locked --no-default-features
          cargo +1.98.0 check --locked --no-default-features --features redb

      - name: install cargo-hack
        uses: taiki-e/install-action@67729d5c413db75907f0ad1e39bb04b9c868ff60
        with:
          tool: cargo-hack@0.6.45

      - name: native feature powerset check
        id: powerset
        run: cargo +1.98.0 hack check --feature-powerset --depth 1 --locked

      - name: fixed simulator gate
        id: simulator
        run: cargo +1.98.0 test --locked --lib simulation::network::tests::simulation_network_fault_matrix_gate -- --ignored --exact

      - name: quality attestation
        if: always()
        shell: bash
        env:
          CHECK: ${{ steps.check.outcome }}
          CLIPPY: ${{ steps.clippy.outcome }}
          TEST: ${{ steps.test.outcome }}
          NATIVE_CHECKS: ${{ steps.native_checks.outcome }}
          POWERSET: ${{ steps.powerset.outcome }}
          SIMULATOR: ${{ steps.simulator.outcome }}
          JOB_STATUS: ${{ job.status }}
          STARTED: ${{ steps.start.outputs.started }}
        run: |
          set -euo pipefail
          mkdir -p target
          commit=$(git rev-parse HEAD)
          lock=$(sha256sum Cargo.lock | awk '{ print $1 }')
          now=$(date +%s)
          duration=$((now - ${STARTED:-$now}))
          if [ "$duration" -lt 0 ]; then duration=0; fi
          uninterrupted=true
          [ "$JOB_STATUS" = "cancelled" ] && uninterrupted=false
          result=pass
          for outcome in "$CHECK" "$CLIPPY" "$TEST" "$NATIVE_CHECKS" \
            "$POWERSET" "$SIMULATOR"; do
            [ "$outcome" = "success" ] || result=fail
          done
          if [ "$uninterrupted" != "true" ]; then result=fail; fi
          printf '{"schema":"radiata.woooo.tech/schemas/test-attestation","commit":"%s","lock_digest":"%s","provider_run_id":"%s","attempt":"%s","job":"windows","target":"quality-windows","budget_seconds":0,"duration_seconds":%s,"uninterrupted":%s,"retry":"complete","predecessor":"","result":"%s"}\n' \
            "$commit" "$lock" "${{ github.run_id }}" "${{ github.run_attempt }}" \
            "$duration" "$uninterrupted" "$result" > target/attestation-quality-windows.json
          cat target/attestation-quality-windows.json

      - name: upload attestation
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: quality-attestation-windows
          path: target/attestation-quality-windows.json
          retention-days: 30

  native-features-test:
    name: native features / test (${{ matrix.os }}, ${{ matrix.config }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      RUSTFLAGS: -Dwarnings
      RUSTDOCFLAGS: -Dwarnings
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            config: no-default
            flags: --no-default-features
          - os: macos-latest
            config: redb-only
            flags: --no-default-features --features redb
          - os: windows-latest
            config: no-default
            flags: --no-default-features
          - os: windows-latest
            config: redb-only
            flags: --no-default-features --features redb

    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: install MSRV toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.98.0

      - name: record start
        id: start
        shell: bash
        run: echo "started=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: cargo test
        id: test
        shell: bash
        run: cargo +1.98.0 test --locked ${{ matrix.flags }}

      - name: quality attestation
        if: always()
        shell: bash
        env:
          TEST: ${{ steps.test.outcome }}
          JOB_STATUS: ${{ job.status }}
          STARTED: ${{ steps.start.outputs.started }}
        run: |
          set -euo pipefail
          mkdir -p target
          commit=$(git rev-parse HEAD)
          lock=$(sha256sum Cargo.lock | awk '{ print $1 }')
          now=$(date +%s)
          duration=$((now - ${STARTED:-$now}))
          if [ "$duration" -lt 0 ]; then duration=0; fi
          uninterrupted=true
          [ "$JOB_STATUS" = "cancelled" ] && uninterrupted=false
          result=fail
          if [ "$TEST" = "success" ] && [ "$uninterrupted" = "true" ]; then result=pass; fi
          printf '{"schema":"radiata.woooo.tech/schemas/test-attestation","commit":"%s","lock_digest":"%s","provider_run_id":"%s","attempt":"%s","job":"native-features-%s-%s","target":"quality-native-features","budget_seconds":0,"duration_seconds":%s,"uninterrupted":%s,"retry":"complete","predecessor":"","result":"%s"}\n' \
            "$commit" "$lock" "${{ github.run_id }}" "${{ github.run_attempt }}" \
            "${{ matrix.os }}" "${{ matrix.config }}" "$duration" "$uninterrupted" "$result" \
            > "target/attestation-native-${{ matrix.os }}-${{ matrix.config }}.json"
          cat "target/attestation-native-${{ matrix.os }}-${{ matrix.config }}.json"

      - name: upload attestation
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: quality-attestation-native-${{ matrix.os }}-${{ matrix.config }}
          path: target/attestation-native-${{ matrix.os }}-${{ matrix.config }}.json
          retention-days: 30

  features-check:
    name: features / check (powerset)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      RUSTFLAGS: -Dwarnings
      RUSTDOCFLAGS: -Dwarnings

    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: install MSRV toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.98.0

      - name: install cargo-hack
        uses: taiki-e/install-action@67729d5c413db75907f0ad1e39bb04b9c868ff60
        with:
          tool: cargo-hack@0.6.45

      - name: verify cargo-hack
        run: test "$(cargo hack --version)" = "cargo-hack 0.6.45"

      - name: feature powerset check
        run: cargo +1.98.0 hack check --feature-powerset --depth 1 --locked

  features-test:
    name: features / test (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUSTFLAGS: -Dwarnings
      RUSTDOCFLAGS: -Dwarnings
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: no-default
            flags: --no-default-features
          - name: json
            flags: --no-default-features --features json
          - name: redb
            flags: --no-default-features --features redb

    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: install MSRV toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.98.0

      - name: cargo test
        run: cargo +1.98.0 test --locked ${{ matrix.flags }}

  container:
    name: container
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: build quality image
        run: docker build --file .github/docker/quality.Dockerfile --tag radiata-quality:${{ github.sha }} .

      - name: run container quality and simulator gate
        run: >-
          docker run --rm
          --volume "${GITHUB_WORKSPACE}/.git:/workspace/.git:ro"
          radiata-quality:${{ github.sha }}

  dependency-policy:
    name: dependency-policy
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: install stable rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: stable

      - name: install cargo-deny
        uses: taiki-e/install-action@67729d5c413db75907f0ad1e39bb04b9c868ff60
        with:
          tool: cargo-deny@0.20.2

      - name: verify cargo-deny
        run: test "$(cargo deny --version)" = "cargo-deny 0.20.2"

      - name: cargo deny
        run: cargo deny --locked --workspace check

      - name: dependency duplicate review
        run: |
          mkdir -p target
          cargo tree --locked --workspace -d > target/dependency-duplicates.txt
          cat target/dependency-duplicates.txt
          # Duplicate crate families in one protocol role are release blockers
          # (ADR-0004). The reviewed baseline names exactly these benign
          # duplicates across distinct roles; any new family fails the lane.
          # getrandom 0.2/0.3/0.4 + rand 0.9/0.10 + syn 2/3: independent
          # third-party minimum versions in distinct dependency roles
          # (ring's CSPRNG draw, proptest's generators, proc-macro
          # internals), none duplicated within a protocol role.
          families=$(grep -oE '^[a-z][a-z0-9_-]*' target/dependency-duplicates.txt | sort -u)
          echo "$families"
          for family in $families; do
            case "$family" in
              getrandom|rand|rand_core|syn) ;;
              *) echo "unreviewed duplicate crate family: $family" >&2; exit 1 ;;
            esac
          done
          jq -n \
            --arg schema "radiata.woooo.tech/schemas/dependency-duplicates-v1" \
            --rawfile duplicates target/dependency-duplicates.txt \
            '{schema: $schema, duplicates: $duplicates}' \
            > target/dependency-duplicates.json
