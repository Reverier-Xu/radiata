[workspace]
members  = ["crates/*"]
resolver = "3"

[workspace.package]
authors      = ["Reverier-Xu <reverier.xu@woooo.tech>"]
edition      = "2024"
license      = "GPL-2.0-only"
publish      = false
repository   = "https://github.com/Reverier-Xu/radiata"
rust-version = "1.98.0"

[workspace.dependencies]
radiata-cadence      = { path = "crates/cadence", features = ["std-time"] }
radiata-test-support = { path = "crates/test-support" }
