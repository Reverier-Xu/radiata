[workspace]
members  = [".", "test-support"]
resolver = "3"

[package]
description  = "Deterministic relay node runtime with identity, membership, storage, and TLS transport primitives."
edition      = "2024"
license      = "GPL-2.0-only"
name         = "radiata"
rust-version = "1.98.0"
version      = "0.0.2"

[features]
default = ["json"]
json    = ["dep:fs4", "dep:rustix", "dep:serde", "dep:serde_json"]
redb    = ["dep:redb"]

[dependencies]
base64 = { version = "0.23", default-features = false, features = ["std"] }
domain = { version = "0.11", default-features = false, features = ["std"] }
ed25519-dalek = { version = "3.0", default-features = false, features = [
  "fast",
  "rand_core",
  "zeroize",
] }
fs4 = { version = "1.1", optional = true }
futures-core = { version = "0.3", default-features = false, features = ["std"] }
futures-util = { version = "0.3", default-features = false, features = [
  "std",
  "async-await",
  "sink",
] }
getrandom = "0.4"
hkdf = "0.13"
hmac = "0.13"
minicbor = { version = "2.3", features = ["derive", "std"] }
rcgen = { version = "0.14", default-features = false, features = [
  "crypto",
  "ring",
] }
redb = { version = "4.1.0", optional = true }
rustls = { version = "0.23", default-features = false, features = [
  "std",
  "ring",
] }
secrecy = { version = "0.10", default-features = false }
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }
sha2 = "0.11"
tokio = { version = "1.53", features = [
  "rt",
  "sync",
  "time",
  "net",
  "io-util",
  "macros",
] }
tokio-rustls = { version = "0.26", default-features = false, features = [
  "ring",
] }
tokio-tungstenite = { version = "0.30", default-features = false, features = [
  "handshake",
] }
tracing = { version = "0.1", default-features = false, features = [
  "std",
  "attributes",
] }
zeroize = "1.9"

[target."cfg(unix)".dependencies]
rustix = { version = "1.1", features = ["fs", "process"], optional = true }

[dev-dependencies]
proptest = "1.11"
radiata-test-support = { path = "test-support" }
tempfile = "3.27"
tokio = { version = "1.53", features = [
  "macros",
  "rt",
  "rt-multi-thread",
  "sync",
  "test-util",
  "time",
] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
wait-timeout = "0.2"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }
unsafe_code     = "forbid"
