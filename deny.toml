[graph]
all-features = true

[advisories]
ignore       = []
unmaintained = "all"
unsound      = "all"
yanked       = "deny"

[licenses]
allow = [
  "Apache-2.0",
  "BSD-3-Clause",
  "BlueOak-1.0.0",
  "GPL-2.0-only",
  "ISC",
  "MIT",
  "Unicode-3.0",
  "Zlib",
]
confidence-threshold = 0.8
include-dev = true

[licenses.private]
ignore = true

[bans]
allow-wildcard-paths = true
deny = [
  { crate = "aws-lc-rs", reason = "ADR-0004 permits ring as the sole rustls provider" },
  { crate = "aws-lc-sys", reason = "ADR-0004 permits ring as the sole rustls provider" },
  { crate = "native-tls", reason = "ADR-0004 requires the reviewed rustls TLS 1.3 stack" },
  { crate = "openssl", reason = "ADR-0004 forbids OpenSSL and alternate TLS providers" },
  { crate = "openssl-sys", reason = "ADR-0004 forbids OpenSSL and alternate TLS providers" },
]
highlight = "all"
multiple-versions = "deny"
multiple-versions-include-dev = true
skip = [
  { crate = "getrandom@0.2.17", reason = "owner=T-G03-02: ring 0.17 uses getrandom 0.2 while production uses getrandom 0.4" },
  { crate = "getrandom@0.3.4", reason = "owner=T-G01-05: proptest uses getrandom 0.3 while production uses getrandom 0.4" },
  { crate = "rand@0.9.5", reason = "owner=T-G03-02: proptest uses rand 0.9 while tungstenite uses rand 0.10" },
  { crate = "rand_core@0.9.5", reason = "owner=T-G02-02: proptest uses rand_core 0.9 while ed25519-dalek 3 uses rand_core 0.10" },
  { crate = "r-efi@5.3.0", reason = "owner=T-G01-05: target-only dependency of the reviewed getrandom 0.3 dev duplicate" },
  { crate = "syn@2.0.119", reason = "owner=T-G01-05: minicbor-derive uses syn 2 while tokio-macros uses syn 3" },
  { crate = "windows-sys@0.52.0", reason = "owner=T-G03-02: mio 1.1 uses windows-sys 0.52 while tokio/fs4 use 0.61" },
]
wildcards = "deny"

[sources]
allow-git        = []
allow-registry   = ["https://github.com/rust-lang/crates.io-index"]
unknown-git      = "deny"
unknown-registry = "deny"
