[graph]
all-features = true

[advisories]
ignore       = []
unmaintained = "all"
unsound      = "all"
yanked       = "deny"

[licenses]
allow = [
  "Apache-2.0",
  "BSD-3-Clause",
  "BlueOak-1.0.0",
  "GPL-2.0-only",
  "ISC",
  "MIT",
  "Unicode-3.0",
]
confidence-threshold = 0.8
include-dev = true

[licenses.private]
ignore = true

[bans]
allow-wildcard-paths = true
deny = [
  { crate = "native-tls", reason = "the TLS stack is rustls with the aws-lc-rs provider; platform TLS facades are outside the reviewed stack" },
  { crate = "openssl", reason = "the TLS stack is rustls with the aws-lc-rs provider; OpenSSL bindings are outside the reviewed stack" },
  { crate = "openssl-sys", reason = "the TLS stack is rustls with the aws-lc-rs provider; OpenSSL bindings are outside the reviewed stack" },
]
highlight = "all"
multiple-versions = "deny"
multiple-versions-include-dev = false
skip = [
  { crate = "syn@2.0.119", reason = "minicbor-derive 0.19.5 (latest) uses syn 2 while tokio-macros uses syn 3; drop when minicbor-derive upgrades" },
]
wildcards = "deny"

[sources]
allow-git        = []
allow-registry   = ["https://github.com/rust-lang/crates.io-index"]
unknown-git      = "deny"
unknown-registry = "deny"
