[package]
name = "radiata-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
radiata = { path = ".." }

[[bin]]
name = "wire_decode"
path = "fuzz_targets/wire_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "reconcile_decode"
path = "fuzz_targets/reconcile_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "persisted_decode"
path = "fuzz_targets/persisted_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "selector"
path = "fuzz_targets/selector.rs"
test = false
doc = false
bench = false

[[bin]]
name = "admission"
path = "fuzz_targets/admission.rs"
test = false
doc = false
bench = false

[[bin]]
name = "feature_selection"
path = "fuzz_targets/feature_selection.rs"
test = false
doc = false
bench = false

[[bin]]
name = "routing"
path = "fuzz_targets/routing.rs"
test = false
doc = false
bench = false

# Prevent this from interfering with workspaces
[workspace]
members = ["."]
