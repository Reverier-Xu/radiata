[package]
edition      = "2024"
name         = "radiata-slo"
publish      = false
rust-version = "1.98.0"
version      = "0.0.0"

[package.metadata]
harness = "radiata sixteen-node oci slo harness (adr-0005)"

[[bin]]
name = "slo-node"
path = "src/bin/slo-node.rs"

[[bin]]
name = "slo-controller"
path = "src/bin/slo-controller.rs"

[dependencies]
ed25519-dalek = { version = "3.0", default-features = false, features = ["fast", "rand_core"] }
futures-core = { version = "0.3", default-features = false, features = ["std"] }
futures-util = { version = "0.3", default-features = false, features = ["std", "async-await"] }
getrandom = "0.4"
radiata = { path = "..", features = ["redb"] }
tokio = { version = "1.53", features = ["macros", "rt-multi-thread"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3.27"

# The harness is an external publish-false workspace: it never joins the
# library workspace and its binaries stay out of every published artifact.
[workspace]
members = ["."]
