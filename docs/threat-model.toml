schema = "radiata.woooo.tech/schemas/threat-model-v1"
status = "accepted"

[[threat]]
id = "THR-001"
mandatory_key = "credential-guessing"
title = "Credential guessing theft and admission flooding"
priority = "P0"
owner_task = "T-G03-06"
scenario_ids = ["SC-G03-P0-18", "SC-G03-P0-22", "E2E-01"]
mitigation = "Use 32-byte ten-minute single-use credentials, constant-time proof, generic failures, fixed 4/64 pending and 16/256-per-minute source/global limits, 1,024 expiring source buckets, one verified committer, and a ten-second deadline."
residual = "A copied unused credential can admit one identity before expiry; distributed traffic can consume the fixed global allowance."
status = "accepted"

[[threat]]
id = "THR-002"
mandatory_key = "replay"
title = "Authentication control packet and metadata replay"
priority = "P0"
owner_task = "T-G03-06"
scenario_ids = ["SC-G03-P0-18", "SC-G06-P0-05", "SC-G07-P0-06", "E2E-05"]
mitigation = "Bind proofs to fresh nonces, roles, TLS exporter, cluster and complete offers; bind route metadata to authenticated endpoints and TraceId; make node/resource replay idempotent."
residual = "Replay can consume bounded parser signature and lookup work before rejection."
status = "accepted"

[[threat]]
id = "THR-003"
mandatory_key = "impersonation"
title = "Peer impersonation MITM and reflection"
priority = "P0"
owner_task = "T-G03-06"
scenario_ids = ["SC-G03-P0-19", "SC-G04-P0-03", "E2E-01"]
mitigation = "Validate TLS 1.3 CertificateVerify, derive RFC 9266 exporter locally, use role-separated proofs and Ed25519 signatures, and require reciprocal exact-key trust."
residual = "A compromised private key or hostile in-process key provider can impersonate its bound identity."
status = "accepted"

[[threat]]
id = "THR-004"
mandatory_key = "identity-clones"
title = "Identity clone collision and key substitution"
priority = "P0"
owner_task = "T-G03-06"
scenario_ids = ["SC-G02-P0-02", "SC-G03-P0-19", "SC-G04-P0-05", "E2E-03"]
mitigation = "Bind immutable random NodeId to one Ed25519 public key, fail closed on conflict, prove possession each session, and create a new identity after key loss."
residual = "Copying the same key and durable identity metadata creates an indistinguishable clone; operators must protect and avoid duplicating stores."
status = "accepted"

[[threat]]
id = "THR-005"
mandatory_key = "sybil-admission"
title = "Sybil admission and credential-generation equivocation"
priority = "P0"
owner_task = "T-G03-03"
scenario_ids = ["SC-G03-P0-07", "SC-G03-P0-08", "SC-G03-P0-09", "E2E-01"]
mitigation = "Permit one committed subject per issuer generation, reserve one verified commit, reconcile indeterminate outcomes, and propagate issuer-signed grants."
residual = "A malicious full member can rotate credentials and create unbounded Sybil growth over time subject only to fixed admission rate and caller/provider resources."
status = "accepted"

[[threat]]
id = "THR-006"
mandatory_key = "stale-metadata"
title = "Stale endpoint trust node and resource metadata replay"
priority = "P0"
owner_task = "T-G05-01"
scenario_ids = [
  "SC-G05-P0-03",
  "SC-G05-P0-08",
  "SC-G07-P0-13",
  "SC-G09-P0-03",
  "E2E-03",
]
mitigation = "Use identity-scoped endpoint expiry, strictly increasing owner-marked node revisions, resource tuple ordering, removal evidence, and bounded normal anti-entropy pages over authenticated sessions (ADR-0008)."
residual = "Offline metadata remains stale until connectivity returns; deliberate removal-evidence cleanup can allow stale metadata to reappear; membership entries from a malicious authenticated member are trusted until revocation closes its sessions."
status = "accepted"

[[threat]]
id = "THR-007"
mandatory_key = "protocol-downgrade"
title = "Protocol feature limit and schema downgrade"
priority = "P0"
owner_task = "T-G03-04"
scenario_ids = [
  "SC-G03-P0-10",
  "SC-G03-P0-11",
  "SC-G03-P0-12",
  "SC-G03-P0-13",
  "SC-G03-P0-14",
  "E2E-09",
]
mitigation = "Transcript-bind complete offers and definition digests, compute the exact dependency-closed intersection and effective limits, refuse required/conflicting/mismatched definitions, and never retry a weaker offer."
residual = "Two peers can use only behavior both explicitly offered; unavailable optional behavior is not an attack."
status = "accepted"

[[threat]]
id = "THR-008"
mandatory_key = "route-amplification"
title = "Route amplification cycle and fan-out abuse"
priority = "P0"
owner_task = "T-G06-01"
scenario_ids = [
  "SC-G06-P0-02",
  "SC-G06-P0-03",
  "SC-G06-P0-04",
  "SC-G06-P0-10",
  "E2E-05",
]
mitigation = "Authenticate route context, validate caller-policy selection, enforce checked loop and wire-field constraints, choose one next hop, and bound queues tasks and fan-out independently of stream length."
residual = "Colluding authenticated nodes can consume the configured bounded forwarding allowance."
status = "accepted"

[[threat]]
id = "THR-009"
mandatory_key = "oversized-payloads"
title = "Malformed noncanonical deeply nested or oversized input"
priority = "P0"
owner_task = "T-G03-06"
scenario_ids = ["SC-G01-P0-01", "SC-G03-P0-21", "SC-G03-P0-22", "SC-G10-P0-10"]
mitigation = "Validate the fixed prelude before allocation, enforce caller-selected frame collection depth queue and task limits, stream packet bodies with constant memory and backpressure, require deterministic CBOR, and fuzz decoders."
residual = "Inputs at configured legal limits consume their explicitly selected parser and queue work."
status = "accepted"

[[threat]]
id = "THR-010"
mandatory_key = "slow-peers"
title = "Slow peer stream queue task and resource saturation"
priority = "P0"
owner_task = "T-G04-04"
scenario_ids = [
  "SC-G04-P0-12",
  "SC-G04-P0-13",
  "SC-G04-P0-14",
  "SC-G04-P0-15",
  "SC-G10-P0-19",
]
mitigation = "Bound queues bytes incoming streams tasks keepalive authentication metadata pages and recovery concurrency; propagate backpressure and assert post-quiescence baselines."
residual = "Enough authenticated colluding members can hold configured global capacities and reduce availability."
status = "accepted"

[[threat]]
id = "THR-011"
mandatory_key = "future-timestamps"
title = "Future timestamp rollback freeze and forward wall-clock jumps"
priority = "P0"
owner_task = "T-G07-01"
scenario_ids = ["SC-G07-P0-01", "SC-G07-P0-02", "SC-G07-P1-03", "SC-G07-P0-16"]
mitigation = "Use host SystemTime explicitly, re-read it after executor wakes, order resource tuples deterministically, expose no peer-clock authority, and test rollback freeze and forward-jump behavior for ordering deadlines and retention."
residual = "A future-dated signed writer can dominate until wall time catches up or a greater tuple appears; discontinuities can delay work indefinitely or make it immediately due."
status = "accepted"

[[threat]]
id = "THR-012"
mandatory_key = "malicious-members"
title = "Authorized malicious or colluding members"
priority = "P0"
owner_task = "T-G09-04"
scenario_ids = [
  "SC-G06-P0-08",
  "SC-G07-P0-06",
  "SC-G09-P0-13",
  "SC-G09-P0-14",
  "E2E-08",
]
mitigation = "Out of architectural scope under the peer-trust deployment model (ADR-0009, 2026-09-05): a hostile properly-admitted member is indistinguishable from a path adversary, and containment is a deployment responsibility documented in the repository README. The revoke/leave/cleanup boundaries remain the expulsion mechanisms; authenticate every source, validate owner route context and revisions, and enforce caller-selected finite capacities."
residual = "The crate assumes only trusted nodes are merged; it does not defend against authorized hostile members. Revoke removes future connectivity and admission authority but does not invalidate otherwise valid stored metadata; colluders can create Sybils over time subject only to deployment controls."
status = "accepted"

[[threat]]
id = "THR-013"
mandatory_key = "secret-disclosure"
title = "Credential private key transcript packet and environment disclosure"
priority = "P0"
owner_task = "T-G01-04"
scenario_ids = ["SC-G01-P0-04", "SC-G02-P0-03", "SC-G10-P0-16", "SC-G10-P0-37"]
mitigation = "Use non-display secret types, opaque key handles, allowlisted bounded diagnostics, forbidden-field validation, corpus screening, normalized artifacts, and never store or upload packet bodies."
residual = "A hostile process OS hypervisor debugger or caller retaining provider authority can read material in its protection domain."
status = "accepted"

[[threat]]
id = "THR-014"
mandatory_key = ""
title = "Canonical encoding schema tag and registry confusion"
priority = "P0"
owner_task = "T-G03-01"
scenario_ids = ["SC-G03-P0-01", "SC-G03-P0-02", "SC-G10-P0-01", "SC-G10-P0-05"]
mitigation = "Use immutable opaque IDs and definitions, deterministic bytes, category/domain validation, duplicate/conflict rejection, exact decoder lookup, and golden vectors."
residual = "A new semantic definition requires a new immutable identity and compatibility evidence."
status = "accepted"

[[threat]]
id = "THR-015"
mandatory_key = ""
title = "Admission indeterminate outcome and double commit"
priority = "P0"
owner_task = "T-G03-03"
scenario_ids = ["SC-G03-P0-07", "SC-G03-P0-08", "SC-G03-P0-09"]
mitigation = "Commit binding credential use and grant atomically; block networking on an indeterminate result; reconcile by canonical TransactionId and digest; never change subject or operation identity."
residual = "Networking remains unavailable while authoritative storage reconciliation cannot complete."
status = "accepted"

[[threat]]
id = "THR-016"
mandatory_key = ""
title = "Address identity misbinding and crossed-dial race"
priority = "P0"
owner_task = "T-G04-02"
scenario_ids = [
  "SC-G04-P0-05",
  "SC-G04-P0-08",
  "SC-G04-P0-09",
  "SC-G04-P0-11",
  "E2E-03",
]
mitigation = "Treat addresses as expiring node-owned candidates, authenticate before activation, choose session ownership from stable identities, and drain replacements deterministically."
residual = "An attacker can advertise unreachable candidates and consume bounded connection attempts."
status = "accepted"

[[threat]]
id = "THR-017"
mandatory_key = ""
title = "Forged or equivocating admission grant and trust snapshot"
priority = "P0"
owner_task = "T-G04-05"
scenario_ids = ["SC-G04-P0-16", "SC-G04-P0-17", "SC-G04-P0-18", "SC-G04-P0-19"]
mitigation = "Verify trusted issuer cluster canonical contents owner revision and signature; persist reciprocal exact bindings; fail closed on NodeId/key conflict."
residual = "A malicious currently trusted issuer can authorize one valid subject per credential generation."
status = "accepted"

[[threat]]
id = "THR-018"
mandatory_key = ""
title = "Forged packet route transition or delivery acknowledgement"
priority = "P0"
owner_task = "T-G06-04"
scenario_ids = ["SC-G06-P0-01", "SC-G06-P0-02", "SC-G06-P0-14", "SC-G06-P0-15"]
mitigation = "Authenticate exact cluster TraceId endpoints target selected node protocol metadata route generation and current-process incoming-stream admission before transition."
residual = "Compromising an endpoint signing key permits authentic-looking messages for that identity."
status = "accepted"

[[threat]]
id = "THR-019"
mandatory_key = ""
title = "Trace metadata expiry and lost duplicate evidence"
priority = "P0"
owner_task = "T-G06-05"
scenario_ids = ["SC-G06-P0-18", "SC-G06-P0-19", "SC-G06-P0-20"]
mitigation = "Start terminal metadata retention at its SystemTime commit, never remove active streams, expose discontinuity behavior, and never treat retained metadata as body durability."
residual = "After trace metadata expires, query and duplicate evidence can be absent; core still cannot recreate or continue packet bytes."
status = "accepted"

[[threat]]
id = "THR-020"
mandatory_key = ""
title = "Lost metadata update transaction identity reuse and commit ambiguity"
priority = "P0"
owner_task = "T-G02-01"
scenario_ids = ["SC-G02-P0-01", "SC-G02-P1-01", "SC-G07-P0-07", "SC-G08-P0-02"]
mitigation = "Use provider-owned immutable snapshots, base/per-key conditions, cross-family atomicity, canonical unique TransactionId plus operation digest, explicit outcomes, receipts, and locked reconciliation."
residual = "An unavailable backend can leave metadata writes blocked until authoritative reopen."
status = "accepted"

[[threat]]
id = "THR-021"
mandatory_key = ""
title = "Storage corruption rollback false durability and hostile provider"
priority = "P0"
owner_task = "T-G02-05"
scenario_ids = ["SC-G02-P0-07", "SC-G02-P1-03", "SC-G08-P0-07", "SC-G08-P0-09"]
mitigation = "Use checksummed immutable JSON generations or redb integrity, alias-safe locks, capability refusal, durability barriers, crash matrices, and fail-closed validation; typed exhaustion never truncates."
residual = "A hostile OS or provider can forge durable reads or discard acknowledged writes; provider capacity and physical durability are outside core."
status = "accepted"

[[threat]]
id = "THR-022"
mandatory_key = ""
title = "Metadata migration ambiguity and schema downgrade"
priority = "P0"
owner_task = "T-G08-04"
scenario_ids = ["SC-G08-P0-10", "SC-G08-P0-11", "SC-G08-P0-12", "SC-G10-P0-03"]
mitigation = "Register immutable explicit metadata edges, reject duplicate cyclic ambiguous missing or downgrade graphs, migrate transactionally, replay by exact implementation digest, and make older readers refuse."
residual = "Removing an already published reader or edge is a compatibility break."
status = "accepted"

[[threat]]
id = "THR-023"
mandatory_key = ""
title = "Unsafe core metadata removal and stale reappearance"
priority = "P0"
owner_task = "T-G07-05"
scenario_ids = [
  "SC-G07-P0-13",
  "SC-G07-P0-14",
  "SC-G07-P0-15",
  "SC-G09-P0-15",
  "E2E-08",
]
mitigation = "Use exact versions for core metadata cleanup, preserve signed removal evidence when needed, forbid automatic invocation, and never dereference a resource URI or delete caller data."
residual = "Unknown offline signed metadata can reappear after deliberate removal-evidence cleanup."
status = "accepted"

[[threat]]
id = "THR-024"
mandatory_key = ""
title = "Evidence command injection artifact poisoning and corpus secret retention"
priority = "P0"
owner_task = "T-G01-04"
scenario_ids = ["SC-G01-P0-04", "SC-G01-P0-05", "SC-G10-P0-10", "SC-G10-P0-11"]
mitigation = "Use closed executable IDs and literal argv, no shell evaluation, allowlisted fields, provenance review before hashing, secret scanning before minimization, and bounded normalized events."
residual = "Human review and classifiers can miss novel sensitive encodings; rejected bytes are deleted before hashing."
status = "accepted"

[[threat]]
id = "THR-025"
mandatory_key = ""
title = "Evidence impact cadence or budget bypass"
priority = "P0"
owner_task = "T-G10-09"
scenario_ids = ["SC-G10-P0-27", "SC-G10-P0-29", "SC-G10-P0-35"]
mitigation = "Map every relevant path to affected verification, require complete current-semantic budgets and uninterrupted attestations, reject stale ADR markers and unmapped paths, and validate the candidate ledger."
residual = "Incorrect path classification remains possible until independent review; ambiguity fails closed."
status = "accepted"

[[threat]]
id = "THR-026"
mandatory_key = ""
title = "Rerun exclusion replacement and product-failure masking"
priority = "P0"
owner_task = "T-G10-09"
scenario_ids = ["SC-G10-P0-28", "SC-G10-P0-29", "SC-G10-P0-36", "SC-G10-P0-37"]
mitigation = "Retain all attempts and predecessor digests, allow new lineage only for independently classified infrastructure failure, prohibit sample replacement, and validate every raw result."
residual = "Provider classification still requires trusted external evidence and reviewer judgment."
status = "accepted"

[[threat]]
id = "THR-027"
mandatory_key = ""
title = "Candidate lock evidence token tag or artifact substitution"
priority = "P0"
owner_task = "T-G10-12"
scenario_ids = ["SC-G10-P0-34", "SC-G10-P0-38", "SC-G10-P0-39", "SC-G10-P0-40"]
mitigation = "Bind every evidence stage, sample, and ledger line to the exact tested commit and lock digest through the fail-fast verification launcher, and publish manually by tagging the commit the launcher verified."
residual = "Publication correctness rests on the operator running the launcher on the exact commit they tag; no platform control defends against the operator bypassing their own review."
status = "accepted"

[[threat]]
id = "THR-028"
mandatory_key = ""
title = "SLO shortcut private access profile falsification or sample omission"
priority = "P0"
owner_task = "T-G10-10"
scenario_ids = [
  "SC-G10-P0-30",
  "SC-G10-P0-31",
  "SC-G10-P0-33",
  "SC-G10-P0-36",
  "E2E-10",
]
mitigation = "Use an external publish-false harness, isolated networks, public facade only, exact host profile, predeclared 125 samples, raw timings, negative shortcuts, and the revised admission packet node-metadata and resource workload."
residual = "The result applies only to the attested same-host unimpaired 16-node profile and not larger or impaired networks."
status = "accepted"

[[threat]]
id = "THR-029"
mandatory_key = ""
title = "Dependency compiler feature or alternate implementation weakening"
priority = "P0"
owner_task = "T-G10-07"
scenario_ids = ["SC-G01-P0-07", "SC-G10-P0-20", "SC-G10-P0-21", "SC-G10-P0-22"]
mitigation = "Fix MSRV and lockfile, use additive features, keep security unconditional, run native powersets, deny unowned sources/advisories, and allow one TLS provider and one implementation per protocol role."
residual = "Future upstream vulnerabilities require advisory action and may force a documented dependency update."
status = "accepted"
