[package]
description  = "Shared test-support harness for the radiata workspace suites."
edition      = { workspace = true }
license      = { workspace = true }
name         = "radiata-test-support"
publish      = { workspace = true }
rust-version = { workspace = true }
version      = { workspace = true }

[dependencies]
sha2  = "0.11"
tokio = { version = "1.54", features = ["sync", "time"] }

[dev-dependencies]
tokio = { version = "1.54", features = ["macros", "rt"] }

[lints.rust]
unsafe_code = "forbid"
